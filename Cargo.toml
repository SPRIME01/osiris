[package]
name = "osiris"
version = "0.8.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
screenshots = "0.8.10"
image = "0.25.1"
leptess = "0.14.0"
ort = "2.0.0-rc.9"
ndarray = "0.16"
axum = "0.7.5"
tokio = { version = "1.37.0", features = ["full"] }
tera = "1.19.1"
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.116"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
dirs = "5.0.1"
anyhow = "1.0.82"
tokenizers = "0.15.2"
regex = "1.10.4"
lazy_static = "1.4.0"
hf-hub = "0.5.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.56.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
psutil = "3.3.0"

[target.'cfg(target_os = "linux")'.dependencies]
# We'll use std::process::Command for xprop/xprintidle for now

[target.'cfg(target_os = "macos")'.dependencies]
# We'll use std::process::Command for ioreg/osascript for now
